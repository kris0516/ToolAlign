name: CPU contracts

on:
  push:
    branches: [main, 'work/**']
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
      - run: uv run --locked pytest -q reports/review/P00/test_independent.py
      - run: uv run --locked python scripts/check_contract_freeze.py
      - run: uv run --locked python scripts/check_public_content.py
      - run: uv run --locked python scripts/check_source_distribution.py

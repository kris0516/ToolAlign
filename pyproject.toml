[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "toolalign"
version = "0.0.1"
description = "Versioned tool-use research contracts for Apple Silicon experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
compatibility = [
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch==2.14.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "psutil==7.2.2",
]

# Select together with compatibility; the tested DPO backend stays opt-in.
dpo = [
  "mlx-lm-lora==3.1.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "datasets==3.6.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Historical candidate checks only; this does not select mlx-tune for formal DPO.
p01-replay = [
  "mlx-tune==0.6.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
toolalign = "toolalign.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.0"]

[tool.hatch.build]
# Apply privacy exclusions to both archives even when Hatchling drops VCS rules
# because an ancestor of an App worktree matches this project's .gitignore.
exclude = [
  ".DS_Store", ".env", ".env.*", "!.env.example", "*.pem", "*.key",
  "*service-account*.json", ".venv/", "venv/", "__pycache__/", "*.py[cod]",
  ".pytest_cache/", ".mypy_cache/", ".ruff_cache/", ".coverage", "htmlcov/",
  ".toolalign-local/", ".codex/", ".worktrees/", "data/raw/", "data/processed/",
  "data/private/", "models/", "checkpoints/", "adapters/", "artifacts/", "runs/",
  "*.safetensors", "*.gguf", "*.pt", "*.pth", "*.bin", "*.onnx", "*.mlpackage/",
  "*.mlmodelc/", "*.log", "node_modules/", "dist/", "build/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolalign"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/toolalign",
  "configs",
  "tests",
  "scripts/check_contract_freeze.py",
  "scripts/check_public_content.py",
  "scripts/check_source_distribution.py",
  "contracts.v1.lock.json",
  "pyproject.toml",
  "uv.lock",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

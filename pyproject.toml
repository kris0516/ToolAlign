[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "toolalign"
version = "0.0.1"
description = "Versioned tool-use research contracts for Apple Silicon experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
compatibility = [
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch==2.14.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "psutil==7.2.2",
]

[project.scripts]
toolalign = "toolalign.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolalign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
